version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - misspell
    - gofmt
    - goimports

  settings:
    misspell:
      locale: US
    goimports:
      local-prefixes:
        - github.com/nnno/my-raindrop-io-mcp-server
